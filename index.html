<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimbot Legit Panel</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #0b0f19;
            border: 2px solid #0055ff;
            box-shadow: 0 0 25px rgba(0, 85, 255, 0.5);
            border-radius: 14px;
            padding: 30px;
            width: 340px;
            text-align: center;
        }
        h2 {
            color: #00d2ff;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #ff0055;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #111827;
            border: 1px solid #0055ff;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }
        .btn {
            background: linear-gradient(135deg, #0055ff, #ff0055);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.4);
        }
        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.8);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }
        .active {
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid #00ff64;
            color: #00ff64;
            display: block;
            box-shadow: 0 0 10px rgba(0, 255, 100, 0.3);
        }
        .error {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ff0055;
            display: block;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>AIMBOT LEGIT PANEL</h2>
        <div class="input-group">
            <label>ENTER KEY:</label>
            <input type="text" id="keyInput" placeholder="Enter license key...">
        </div>
        <button class="btn" onclick="toggleAimbot()">ACTIVATE</button>
        <div id="statusBox" class="status"></div>
    </div>

    <script>
        function toggleAimbot() {
            const key = document.getElementById('keyInput').value.trim();
            const statusBox = document.getElementById('statusBox');

            if (key === "aimbotlegit") {
                statusBox.className = "status active";
                statusBox.innerText = "Aimbot Legit Active";
            } else {
                statusBox.className = "status error";
                statusBox.innerText = "Invalid Key! Please check again.";
            }
        }
    </script>
</body>
</html>
